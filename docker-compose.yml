services:
  tackety:
    build: .
    container_name: tackety
    ports:
      - "8000:8000"
    volumes:
      # Named volume, not a bind mount: keeps the three SQLite databases
      # (conversations.db, issues.db, support.db, knowledge.db) and the
      # preprocessed doc-context files persistent across container
      # restarts/rebuilds without depending on host filesystem layout.
      - tackety_data:/app/engine/data
    env_file:
      - engine/.env
    environment:
      # Overridable here without touching engine/.env, e.g. in a deploy
      # pipeline that injects secrets differently than a local .env file.
      - TACKETY_DATA_DIR=/app/engine/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  tackety_data:
